<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18181b" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title></title>
    <meta name="description" content="Discover 𝐍𝐨𝐯𝐚 𝐍𝐢𝐢𝐆𝐞𝐧. Refined contemporary ready-to-wear, architectural outerwear, Mongolian cashmere, handcrafted leather goods, and timeless footwear.">
    <meta property="og:title" content="𝐍𝐨𝐯𝐚 𝐍𝐢𝐢𝐆𝐞𝐧">
    <meta property="og:description" content="Refined contemporary ready-to-wear, architectural tailoring, Mongolian cashmere, and artisan leather goods.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=1200&q=80">
    <style>
        html {
            background-color: #faf9f6;
            scroll-behavior: smooth;
        }
        
        html.dark {
            background-color: #0c0a09;
        }
        
        .font-serif {
            font-family: 'Cormorant Garamond', Georgia, serif;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }
    </style>
    <script>
        (function() {
            var mode = localStorage.getItem('vueuse-color-scheme') || 'dark'
            var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
            if (dark) {
                document.documentElement.classList.add('dark')
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0c0a09')
            }
        })()
    </script>
</head>

<body class="bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-stone-100 antialiased selection:bg-amber-800 selection:text-white">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
